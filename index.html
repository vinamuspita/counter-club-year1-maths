<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counter Club: Year 1 Maths</title>
<style>
:root{
  --font:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --paper:#EAF3FA;--grid:rgba(47,111,208,.10);--ink:#1B2A47;--ink-soft:#4B5A7A;--card:#FFFFFF;--soft:#F3F8FC;--line:#C5D6E6;
  --red:#E5484D;--red-d:#A8262B;--yellow:#F5B81C;--yellow-d:#B5830A;--green:#23915D;--green-d:#14613D;--blue:#2F6FD0;--blue-d:#1C4791;--purple:#7657DB;--purple-d:#4F35A3;
  --good:#E1F4E9;--good-ink:#135C39;--try:#FFF3D3;--try-ink:#6B4C00;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111A2B;--grid:rgba(120,170,255,.07);--ink:#E9EFFA;--ink-soft:#A8B5CC;--card:#1A2439;--soft:#212D46;--line:#33415E;
  --good:#16392A;--good-ink:#9BE3BC;--try:#3A3014;--try-ink:#F7D98A;color-scheme:dark;}}
:root[data-theme="dark"]{--paper:#111A2B;--grid:rgba(120,170,255,.07);--ink:#E9EFFA;--ink-soft:#A8B5CC;--card:#1A2439;--soft:#212D46;--line:#33415E;--good:#16392A;--good-ink:#9BE3BC;--try:#3A3014;--try-ink:#F7D98A;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;font-size:1.125rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:clamp(1.8rem,5vw,2.6rem)}h2{font-size:1.45rem}h3{font-size:1.2rem}
p{margin:.3rem 0 .7rem}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px;border-radius:8px}
img,svg{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding:1rem clamp(.8rem,3vw,1.6rem) 4rem}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:3px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.55rem clamp(.8rem,3vw,1.6rem);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.25rem;background:none;border:0;cursor:pointer;padding:.2rem}
.logo{display:grid;grid-template-columns:repeat(2,14px);gap:2px}.logo i{width:14px;height:14px;border-radius:3px;display:block}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:.25rem .8rem;font-weight:700;cursor:pointer}
.chip.static{cursor:default}
/* cube buttons */
.btn{--c:var(--blue);--cd:var(--blue-d);background:var(--c);color:#fff;border:0;border-radius:14px;padding:.7em 1.2em;font-weight:700;font-size:1.1rem;box-shadow:0 5px 0 var(--cd);cursor:pointer;transition:transform .06s,box-shadow .06s;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{font-size:.98rem;padding:.45em .9em;min-height:42px;border-radius:12px}
.btn.lg{font-size:1.3rem;padding:.8em 1.6em}
.c-red{--c:var(--red);--cd:var(--red-d)}.c-yellow{--c:var(--yellow);--cd:var(--yellow-d);color:#2E2200}.c-green{--c:var(--green);--cd:var(--green-d)}.c-blue{--c:var(--blue);--cd:var(--blue-d)}.c-purple{--c:var(--purple);--cd:var(--purple-d)}
.c-ghost{--c:var(--card);--cd:var(--line);color:var(--ink);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:clamp(1rem,2.5vw,1.4rem);margin:0 0 1rem}
.muted{color:var(--ink-soft)}.tiny{font-size:.92rem;color:var(--ink-soft)}
.say{background:var(--soft);border:2px solid var(--line);border-radius:999px;width:40px;height:40px;cursor:pointer;flex:none;font-size:1.05rem;display:inline-grid;place-items:center;vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
/* dashboard */
.hello{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:.6rem 0 1.2rem}
.avatar{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:2.2rem;background:var(--soft);border:3px solid var(--line);flex:none}
.continue{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--blue);color:#fff;border-radius:22px;padding:1.2rem 1.4rem;margin-bottom:1.4rem;box-shadow:0 6px 0 var(--blue-d)}
.continue h2{margin:0}.continue p{margin:.2rem 0 0;opacity:.95}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-bottom:1.6rem}
.unit{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:1rem;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;min-height:150px}
.unit:hover{border-color:var(--blue)}
.unit .n{font-weight:700;font-size:.95rem;color:var(--ink-soft)}
.unit .t{font-weight:700;font-size:1.15rem;line-height:1.25}
.unit.locked{opacity:.62;cursor:default}
.tower{display:flex;gap:4px;margin-top:auto;align-items:flex-end}
.cube{width:22px;height:22px;border-radius:5px;background:var(--soft);border:2px solid var(--line)}
.cube.s{background:linear-gradient(to top,var(--uc) 50%,var(--soft) 50%);border-color:var(--uc)}
.cube.m{background:var(--uc);border-color:var(--uc)}
.badges{display:flex;flex-wrap:wrap;gap:.6rem}
.badge{display:flex;flex-direction:column;align-items:center;width:96px;text-align:center;font-size:.85rem;line-height:1.2;gap:.3rem}
.badge .b{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:var(--soft);border:3px dashed var(--line);filter:grayscale(1);opacity:.55}
.badge.on .b{filter:none;opacity:1;border:3px solid var(--yellow);background:var(--try)}
.list{list-style:none;padding:0;margin:0}.list li{display:flex;gap:.6rem;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:2px dashed var(--line)}.list li:last-child{border:0}
.stars{color:var(--yellow);letter-spacing:2px;font-size:1.15rem;white-space:nowrap}.stars .off{color:var(--line)}
/* unit page */
.topic{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.topic .tn{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:1.2rem;color:#fff;flex:none}
.topic .tb{flex:1;min-width:200px}
.pill{display:inline-block;border-radius:999px;padding:.05rem .65rem;font-size:.85rem;font-weight:700;border:2px solid var(--line);background:var(--soft)}
.pill.g{background:var(--good);color:var(--good-ink);border-color:transparent}.pill.y{background:var(--try);color:var(--try-ink);border-color:transparent}
/* lesson */
.crumbs{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:.3rem 0 .8rem}
.crumbs button{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:.2rem;text-decoration:underline}
.stepper{display:flex;gap:.4rem;overflow-x:auto;padding:.3rem .1rem .9rem;margin-bottom:.4rem}
.stp{flex:none;display:flex;align-items:center;gap:.4rem;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem .85rem;font-weight:700;cursor:pointer;font-size:.98rem}
.stp .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:.8rem;border:2px solid var(--line)}
.stp.cur{border-color:var(--blue);background:var(--blue);color:#fff}.stp.cur .d{background:#fff;color:var(--blue);border-color:#fff}
.stp.ok .d{background:var(--green);color:#fff;border-color:var(--green)}
.objectives{padding-left:1.3rem;margin:.3rem 0}.objectives li{margin:.35rem 0}
.steps{list-style:none;counter-reset:s;padding:0;margin:0}
.steps>li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:.2rem .8rem;margin:0 0 1rem}
.steps>li::before{content:counter(s);width:40px;height:40px;border-radius:12px;background:var(--yellow);color:#2E2200;font-weight:700;display:grid;place-items:center;grid-row:span 2}
.steps>li>div{grid-column:2}
.def{font-size:1.3rem;font-weight:700}
.keyidea{background:var(--yellow);color:#2E2200;border-radius:20px;padding:1.2rem 1.4rem;margin:0 0 1rem;box-shadow:0 5px 0 var(--yellow-d)}
.keyidea p{font-size:1.3rem;font-weight:700;margin:0}
.real{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.real div{background:var(--soft);border-radius:14px;padding:.8rem;display:flex;gap:.6rem;align-items:center}.real .e{font-size:2rem}
.vocab{display:flex;flex-wrap:wrap;gap:.6rem}
.word{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:.5rem .8rem;cursor:pointer;text-align:left;max-width:260px}
.word b{display:block;font-size:1.15rem;color:var(--blue)}
/* visuals */
.obj{font-size:2.2rem;line-height:1.05;position:relative;display:inline-block}
.obj.sm{font-size:1.5rem}
.num{position:absolute;top:-6px;right:-10px;background:var(--ink);color:var(--card);font-size:.75rem;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;line-height:1;font-family:var(--font)}
.objrow{display:flex;flex-wrap:wrap;gap:.35rem .6rem;justify-content:center;padding:.5rem}
.objrow.sm .obj{font-size:1.5rem}
.scatter{position:relative;aspect-ratio:5/3;width:min(100%,440px);margin:0 auto;background:var(--soft);border-radius:18px;border:2px dashed var(--line)}
.scatter .obj{position:absolute;font-size:clamp(1.5rem,6.5vw,2.3rem)}
.tapobj{background:none;border:0;cursor:pointer;padding:0}.tapobj.done{filter:saturate(.6)}
.tf{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--ink);padding:4px;border-radius:10px;width:min(100%,320px);margin:0 auto}
.tf .cell{aspect-ratio:1;background:var(--card);border-radius:6px;display:grid;place-items:center;position:relative;border:0;padding:0}
.tf.build .cell{cursor:pointer}
.tf.mini{width:150px;gap:2px;padding:2px}.tf.mini .cell{border-radius:3px}
.ctr{width:72%;aspect-ratio:1;border-radius:50%;display:inline-block;background:var(--red);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ctr.blue{background:var(--blue)}.ctr.green{background:var(--green)}.ctr.yellow{background:var(--yellow)}.ctr.purple{background:var(--purple)}.ctr.red{background:var(--red)}
.ctrrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:.4rem}.ctrrow .ctr{width:34px}
.groups{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.grp{border:3px solid var(--line);border-radius:999px;padding:.5rem .9rem;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:240px}
.grp .ctr{width:30px;position:relative}
.grp.blue{border-color:var(--blue)}.grp.yellow{border-color:var(--yellow)}
.domino .dbody{fill:var(--card);stroke:var(--ink);stroke-width:3}.domino .dline{stroke:var(--ink);stroke-width:2}.domino .pip{fill:var(--ink)}
.track{display:flex;flex-wrap:wrap;justify-content:center;padding:.3rem}
.tcell{min-width:3rem;height:3.3rem;border:2px solid var(--ink);margin:0 0 -2px -2px;display:grid;place-items:center;font-weight:700;font-size:1.4rem;background:var(--card);padding:0 .3rem}
.tcell.hi{background:var(--yellow);color:#2E2200}.tcell.od{background:#FBE0E1;color:#6B1418}.tcell.ev{background:#DCE8FA;color:#14336B}
.tcell.word{font-size:1rem;min-width:4.4rem}
.tcell.bl{padding:2px}
.lineup{display:grid;gap:4px;justify-content:center}
.lurow{display:grid;grid-template-columns:repeat(var(--m),44px);gap:4px;justify-content:center}
.lu{height:44px;display:grid;place-items:center;font-size:1.7rem;border-radius:10px}
.lu .ctr{width:34px}
.lu.extra{background:var(--try);outline:3px solid var(--yellow)}
.pairs{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.4rem}
.pair{display:flex;flex-direction:column;gap:2px;border:3px solid var(--blue);border-radius:16px;padding:.3rem .4rem;font-size:1.8rem;line-height:1.1;min-height:84px;justify-content:center}
.pair.lone{border-color:var(--red);border-style:dashed}
.pair.plain{border-color:var(--line)}
.plate{width:220px;height:110px;margin:0 auto;border-radius:50%;background:radial-gradient(ellipse at center,var(--card) 52%,var(--line) 54%,var(--soft) 58%,var(--line) 70%);display:grid;place-items:center;font-size:1.8rem;border:2px solid var(--line)}
.bignum{font-size:3.4rem;font-weight:700;line-height:1}
.labbox{background:var(--soft);border-radius:16px;padding:1rem}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.6rem}
.wcard{background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:110px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.4rem}
.wcard .bignum{font-size:2.4rem}.wcard.flip{border-color:var(--purple);background:var(--soft)}
.trace{position:relative;width:220px;height:220px;border:2px dashed var(--line);border-radius:16px;background:var(--card);touch-action:none}
.trace .ghost{position:absolute;inset:0;display:grid;place-items:center;font-size:170px;font-weight:700;color:var(--line);pointer-events:none;line-height:1}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
.stepbox{display:flex;align-items:center;gap:.5rem;font-weight:700}
.stepbox output{min-width:2ch;text-align:center;font-size:1.4rem}
/* question */
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:clamp(1rem,3vw,1.5rem)}
.qhead{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between}
.prompt{font-size:clamp(1.25rem,3.4vw,1.55rem);font-weight:700;margin:0 0 .8rem}
.qvis{margin:.4rem 0 1rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.opts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.opt{min-width:84px;min-height:72px;font-size:1.6rem;font-weight:700;border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer;padding:.4rem .9rem;box-shadow:0 4px 0 var(--line)}
.opt.vis{padding:.6rem;min-width:140px}
.opts.stack{flex-direction:column;align-items:stretch}.opts.stack .opt{width:100%}
.opts.words .opt{font-size:1.25rem}
.opts.track{gap:0}.opts.track .opt{border-radius:0;min-width:3.2rem;margin-left:-3px;box-shadow:none}
.opt.right{border-color:var(--green);background:var(--good);box-shadow:0 4px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:#FCE3E4;color:#7A1418;text-decoration:line-through;box-shadow:0 4px 0 var(--red)}
.opt.sel{border-color:var(--blue);background:#DCE8FA;color:#14336B;box-shadow:0 4px 0 var(--blue)}
.opt:disabled{cursor:default}
.blanks{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-bottom:.6rem}
.bl-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:700}
.blank{min-width:64px;height:64px;border:3px dashed var(--ink-soft);border-radius:14px;background:var(--soft);font-size:1.8rem;font-weight:700;cursor:pointer}
.tcell .blank{min-width:48px;height:46px;font-size:1.4rem;border-radius:8px}
.blank.active{border-style:solid;border-color:var(--blue);background:#DCE8FA;color:#14336B}
.blank.ok{border:3px solid var(--green);background:var(--good);color:var(--good-ink)}
.blank.no{border:3px solid var(--red);background:#FCE3E4;color:#7A1418}
.pad{display:grid;grid-template-columns:repeat(6,minmax(48px,64px));gap:.45rem;justify-content:center;margin:.4rem 0}
.pad button{height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.qactions{display:flex;justify-content:center;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}
.slots,.pool{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.5rem 0}
.slot{width:72px;height:64px;border:3px dashed var(--ink-soft);border-radius:14px;background:var(--soft);font-size:1.4rem;font-weight:700;cursor:pointer}
.slot.full{border-style:solid;border-color:var(--blue);background:var(--card)}
.slot.no{border-color:var(--red);background:#FCE3E4;color:#7A1418}
.tile{min-width:72px;height:60px;border-radius:14px;border:3px solid var(--purple);background:var(--card);font-size:1.3rem;font-weight:700;cursor:grab;box-shadow:0 4px 0 var(--purple);padding:0 .6rem}
.tile.sel{background:var(--purple);color:#fff}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.6rem}
.bin{border:3px solid var(--line);border-radius:18px;min-height:130px;padding:.6rem;display:flex;flex-direction:column;gap:.4rem;cursor:pointer;background:var(--soft)}
.bin h3{margin:0;text-align:center}
.bin .in{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.match{display:grid;grid-template-columns:1fr auto;gap:.6rem 1rem;align-items:center}
.mL,.mR{border:3px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;min-height:64px;padding:.3rem .6rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.mR{min-width:80px;font-size:1.5rem;font-weight:700}
.mcol{display:flex;flex-direction:column;gap:.6rem}
.mL.sel{border-color:var(--ink);outline:3px solid var(--yellow)}
.dombuild{display:flex;gap:0;justify-content:center;border:3px solid var(--ink);border-radius:16px;width:max-content;margin:0 auto;background:var(--card)}
.dombuild .half{display:grid;grid-template-columns:repeat(3,48px);gap:4px;padding:10px}
.dombuild .half+.half{border-left:3px solid var(--ink)}
.dcell{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line);background:none;cursor:pointer}
.dcell.on{background:var(--ink);border-color:var(--ink)}
.feedback:empty{display:none}
.fb{margin-top:1rem;border-radius:18px;padding:1rem 1.2rem}
.fb.good{background:var(--good);color:var(--good-ink)}.fb.try{background:var(--try);color:var(--try-ink)}
.fbtitle{font-size:1.35rem;font-weight:700;margin:0 0 .4rem;display:flex;align-items:center;gap:.5rem}
.fb ol{margin:.3rem 0 .8rem;padding-left:1.4rem}.fb li{margin:.25rem 0}
.fb .qvis{background:var(--card);border-radius:14px;padding:.6rem;color:var(--ink)}
.answer{font-weight:700;font-size:1.2rem}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.guide{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:.8rem}
.hintbox:empty{display:none}.hintbox{margin-top:.8rem;background:var(--soft);border-radius:14px;padding:.8rem 1rem;border-left:6px solid var(--yellow)}
.dots{display:flex;gap:6px;justify-content:center;margin:.2rem 0 .8rem;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.dots i.ok{background:var(--green);border-color:var(--green)}.dots i.help{background:var(--yellow);border-color:var(--yellow)}.dots i.cur{border-color:var(--blue);border-width:3px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1rem}
.level{border:3px solid var(--line);border-radius:18px;padding:1rem;background:var(--card);display:flex;flex-direction:column;gap:.4rem}
.level.f{border-color:var(--green)}.level.p{border-color:var(--blue)}.level.c{border-color:var(--purple)}
.big-score{font-size:3rem;font-weight:700;line-height:1}
/* tables & admin */
.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl th,.tbl td{border-bottom:2px solid var(--line);padding:.5rem .4rem;text-align:left;vertical-align:top}
.tbl th{font-size:.92rem;color:var(--ink-soft)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}

function verify(q){const p=[];

 if(!KINDS_LIST.includes(q.kind))p.push("Unknown kind "+q.kind);
 if(q.kind==="mc"){const vs=q.options.map(o=>String(o.v)),ls=q.options.map(o=>o.label);if(new Set(vs).size!==vs.length)p.push("Duplicate option values");if(new Set(ls).size!==ls.length)p.push("Duplicate option labels");

  if(q.track&&q.track.filter(c=>typeof c==="object").length!==q.blanks.length)p.push("Track blanks do not match answer boxes");}
 if(q.kind==="order"){if(q.items.slice().sort().join()!==q.correctOrder.slice().sort().join())p.push("Order items differ from answer");if(q.items.join()===q.correctOrder.join())p.push("Items already in order");if(new Set(q.items).size!==q.items.length)p.push("Duplicate order items");}

 if(q.kind==="sort"){q.items.forEach(it=>{if(!q.bins.some(b=>b.id===q.correctBin[it.v]))p.push("Item has no bin")});if(new Set(q.items.map(i=>String(i.v))).size!==q.items.length)p.push("Duplicate sort items")}

  const bankForm=it=>{const kinds=BANK_KINDS[ft];const cur=it||{kind:kinds[0],level:"practice",n:5,a:6,b:4,object:"apple",objectB:"duck",prompt:"",prompt_id:""};const f=$("#bform");

   <label class="f">Object<select data-k="object">${OBJ.map(o=>`<option value="${o.s}" ${cur.object===o.s?"selected":""}>${o.e} ${o.s}</option>`).join("")}</select></label><label class="f">Object 2<select data-k="objectB">${OBJ.map(o=>`<option value="${o.s}" ${cur.objectB===o.s?"selected":""}>${o.e} ${o.s}</option>`).join("")}</select></label></div>

   $("#bsave").onclick=async()=>{if(!chk())return;const v=Object.assign({},it||{},read(),{topic:ft,status:"draft",origin:it?it.origin:"teacher",created:it?it.created:today(),edited:today()});const id=it?it.id:uid();delete v.id;await Store.setDoc("bank",id,v).catch(()=>toast("Could not save."));App.bank=App.bank.filter(x=>x.id!==id).concat([Object.assign({id},v)]);toast("Saved as draft.");draw()}};
  const aiGenerate=async()=>{const btn=$("#aigen");let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){}if(!sample){toast(T("AI is not available in this view.","AI tidak tersedia di tampilan ini."));return}
   btn.disabled=true;btn.textContent="…";const kinds=BANK_KINDS[ft];const tt=TOPIC_EN[ft];
   const prompt=`You write short maths questions for children aged 5 to 7 (Cambridge Primary Mathematics, Year 1, Unit 1 Numbers to 10, topic ${ft} "${tt}").
Return JSON only, no other text: {"items":[...]} with exactly 3 items.
Each item has: "kind" (one of ${JSON.stringify(kinds)}), "level" ("focus", "practice" or "challenge"), "n", "a", "b" (integers), "object" and "objectB" (each one of ${JSON.stringify(OBJ.map(o=>o.s))}), "prompt" (one short question in simple British English, at most 16 words) and "prompt_id" (the same question in simple Indonesian for young children).
Rules: whole numbers from 0 to 10. count: n from 1 to 10, and neither prompt may contain the number or its word. after: n 0 to 9. before: n 1 to 10. more and fewer: a and b different, 1 to 9, object and objectB different. word: n 1 to 10. oddeven: n 1 to 10.
Use friendly everyday settings like a garden, a picnic or a classroom. No real people's names. No brands. Vary the numbers.`;
   try{const data=await sample.json(prompt,{modelTier:"default"});const its=(data&&data.items)||[];let ok=0,bad=0;
    for(const raw of its.slice(0,3)){const it={kind:String(raw.kind),level:["focus","practice","challenge"].includes(raw.level)?raw.level:"practice",n:parseInt(raw.n,10),a:parseInt(raw.a,10),b:parseInt(raw.b,10),object:objBy(raw.object)?raw.object:"apple",objectB:objBy(raw.objectB)?raw.objectB:"duck",prompt:String(raw.prompt||"").replace(/[<>]/g,"").slice(0,160),prompt_id:String(raw.prompt_id||"").replace(/[<>]/g,"").slice(0,160),topic:ft,status:"draft",origin:"ai",created:today()};
     if(!kinds.includes(it.kind)){bad++;continue}try{buildBank(it);const id=uid();await Store.setDoc("bank",id,it);App.bank.push(Object.assign({id},it));ok++}catch(e){bad++}}
    toast(`${ok} draft(s) added.${bad?` ${bad} rejected by the checker.`:""}`)}catch(e){toast(e&&e.code==="rate_limited"?"AI is busy. Try again soon.":"AI could not write questions this time.")}draw()};draw();return}
 if(tab==="checks"){el.innerHTML=`<div class="card"><h2>${T("Answer-key checks","Pemeriksaan kunci jawaban")}</h2><p>${T("Every generator in all 16 units is run many times in the current language. Each question is checked: correct answer among the options, no duplicates, at least one wrong option, the picture matching the number in the question, the explanation stating the answer, and the checker accepting the model answer. Questions that fail are never shown to learners.","Setiap generator di 16 unit dijalankan berkali-kali dalam bahasa saat ini. Setiap soal diperiksa: jawaban benar ada di pilihan, tidak ada duplikat, ada pilihan salah, gambar sesuai bilangan di soal, penjelasan menyebut jawaban, dan pemeriksa menerima jawaban contoh. Soal yang gagal tidak pernah ditampilkan.")}</p><button class="btn c-blue" id="runchk">${T("Run 100 checks per generator","Jalankan 100 pemeriksaan per generator")}</button></div><div id="chkout"></div>`;
  $("#runchk").onclick=()=>{const rows=[];const seen=new Set();for(const [t,fn] of Object.entries(TOPIC)){const C=fn();for(const lv of ["focus","practice","challenge"])for(const g of C.pools[lv].concat(lv==="focus"?C.guided:[])){if(seen.has(g))continue;seen.add(g);let pass=0,fail=0,first="";for(let i=0;i<100;i++){let p;try{p=verify(GEN[g].fn())}catch(e){p=[String(e)]}if(p.length){fail++;if(!first)first=p.join("; ")}else pass++}rows.push({t,lv,g,pass,fail,first})}}
   const tf=rows.reduce((s,r)=>s+r.fail,0);$("#chkout").innerHTML=`<div class="card"><p class="def">${tf?`⚠️ ${tf}`:`✓ ${rows.length*100} ${T("generated questions passed.","soal lolos pemeriksaan.")}`}</p><div class="scroll"><table class="tbl"><thead><tr><th>${T("Topic","Topik")}</th><th>Generator</th><th>Level</th><th>✓</th><th>✗</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.t}</td><td>${esc(GEN[r.g].name)}</td><td>${r.lv}</td><td>${r.pass}</td><td>${r.fail?`<b style="color:var(--red)">${r.fail}</b> ${esc(r.first)}`:"0"}</td><td><button class="btn sm c-ghost" data-pg="${r.g}">${T("Preview","Pratinjau")}</button></td></tr>`).join("")}</tbody></table></div></div>`;
   $$("[data-pg]",el).forEach(b=>b.onclick=()=>modal(`<div class="row" style="justify-content:space-between"><h2>${esc(GEN[b.dataset.pg].name)}</h2><span class="row"><button class="btn sm c-blue" data-again>${T("Another","Lainnya")}</button><button class="btn sm c-ghost" data-close>✕</button></span></div><div id="pv"></div>`,box=>{const show=()=>mountQuestion($("#pv",box),make(b.dataset.pg),{mode:"preview",onResult:()=>{}});show();$("[data-again]",box).onclick=show}))};return}
 if(tab==="sources"){App.sources=await Store.list("sources").catch(()=>App.sources);let assets=null;try{assets=window.claude&&window.claude.use?await window.claude.use("assets"):null}catch(e){}const src=App.sources.length?App.sources:[SEED_SOURCE];
  el.innerHTML=`${src.map(s=>`<div class="card"><h2>${esc(s.title)}</h2><p class="tiny">${esc(s.authors||"")} ${s.edition?"· "+esc(s.edition):""} ${s.isbn?"· ISBN "+esc(s.isbn):""}</p><p>${esc(s.usage||"")}</p>${s.url?`<a class="btn sm c-ghost" href="${esc(s.url)}" target="_blank" rel="noopener">Open</a>`:""}</div>`).join("")}
   <div class="card"><h2>${T("Add a reference document","Tambah dokumen rujukan")}</h2><p class="tiny">${T("Upload only documents your school is authorised to store. Files are not shown to learners.","Unggah hanya dokumen yang boleh disimpan sekolahmu. Berkas tidak ditampilkan ke murid.")}</p>
   ${assets?`<div class="form"><label class="f">Title<input type="text" id="stitle"></label><label class="f">File<input type="file" id="sfile" accept=".pdf,.png,.jpg,.jpeg,.txt,.md"></label></div><label style="display:flex;gap:.5rem;margin:.6rem 0"><input type="checkbox" id="sauth"> ${T("I confirm we are authorised to store this document.","Saya memastikan kami berhak menyimpan dokumen ini.")}</label><button class="btn c-green" id="sup">Upload</button>`:`<p class="muted">${T("Upload is available to editors in the published app.","Unggah tersedia untuk editor di aplikasi yang dipublikasikan.")}</p>`}</div>`;

 if(tab==="perf"){if(Store.mode!=="cloud"){el.innerHTML=`<div class="card"><p>${T("Learner performance across accounts appears here in the published app. Names are never shared.","Kinerja murid lintas akun tampil di sini di aplikasi yang dipublikasikan. Nama tidak pernah dibagikan.")}</p></div>`;return}
  const docs=await Store.list("stats").catch(()=>[]);const agg={};let learners=0;docs.forEach(d=>Object.values(d.learners||{}).forEach(L=>{learners++;Object.entries(L.topics||{}).forEach(([k,v])=>{const t=k.replace("_",".");const a=agg[t]=agg[t]||{n:0,c:0,w:0,qb:0,qn:0,m:0};a.n++;a.c+=v.c||0;a.w+=v.w||0;if(v.qb!=null){a.qb+=v.qb;a.qn++}if(v.m)a.m++})}));
